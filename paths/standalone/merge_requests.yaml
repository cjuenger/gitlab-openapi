# /v4/merge_requests

/v4/merge_requests:
    get:
      tags:
        - Standalone
      operationId: getMergeRequests
      summar: Get all merge requests the authenticated user has access to.
      parameters:
        - name: 
          in: query
          schema:
            type: array
            items: integer
          description: Returns the merge requests approved by all the users with the given id, up to 5 users.
